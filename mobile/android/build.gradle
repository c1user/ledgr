// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Some third-party Capacitor plugins still hard-code compileSdkVersion 35
// (speech-recognition 7.x), while the AndroidX versions this project pulls in
// (activity 1.11+) require every module to compile against 36+. Lift each
// library module to the project's compileSdkVersion after its own script has
// run; modules that already match are untouched. Revisit when every plugin
// ships a Capacitor 8 release.
subprojects { sub ->
    sub.afterEvaluate {
        if (sub.plugins.hasPlugin('com.android.library')) {
            sub.android.compileSdk = rootProject.ext.compileSdkVersion
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
